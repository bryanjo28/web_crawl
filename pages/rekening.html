<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rekening Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/styles.css" />
    <link href="../static/fontawesome/css/all.min.css" rel="stylesheet">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  </head>
  <body>
    <div class="container-fluid">
      <div class="row min-vh-100">
        <!-- Sidebar loaded dynamically via JavaScript -->
        <div class="col-md-2 bg-light sidebar py-3 border-end">
          <!-- Sidebar content will be dynamically loaded here -->
        </div>

        <div class="col-md-10 p-4 content" id="content">
          <h2>Rekening Management</h2>
          <!-- Filter Form -->
          <div class="row mb-3">
            <div class="col-md-3">
              <label>Flag Blokir:</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-3">
              <label>Bank:</label>
              <input type="text" class="form-control" />
            </div>
          </div>

          <!-- Buttons -->
          <div class="mb-3">
            <button class="btn btn-primary">Search</button>
            <button class="btn btn-success">Add</button>
            <button class="btn btn-warning">Upload</button>
            <button class="btn btn-info">Export</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Rekening Table -->
    <table class="table table-bordered">
      <thead class="table-primary">
        <tr>
          <th>Nomor Rekening</th>
          <th>Bank</th>
          <th>Situs</th>
          <th>Tgl Temuan</th>
          <th>Tgl Blokir</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for rekening in rekening_data %}
        <tr>
          <td>{{ rekening.nomor_rekening }}</td>
          <td>{{ rekening.bank }}</td>
          <td>{{ rekening.situs }}</td>
          <td>{{ rekening.tgl_temuan }}</td>
          <td>{{ rekening.tgl_blokir }}</td>
          <td>
            <button class="btn btn-sm btn-warning">✏️</button>
            <button class="btn btn-sm btn-danger">🗑️</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <!-- Bootstrap JS -->
    <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
    ></script>
    <script src="../static/js/rekening.js"></script>
  </body>
</html>
