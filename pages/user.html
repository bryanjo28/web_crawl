<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Management</title>
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"> -->
  <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link href="/static/fontawesome/css/all.min.css" rel="stylesheet" />
  <!-- Flatpickr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
  <div class="container-fluid">
    <div class="row min-vh-100">
      <!-- Sidebar loaded dynamically via JavaScript -->
      <div class="col-md-2 bg-light sidebar py-3 border-end">
        <!-- Sidebar content will be dynamically loaded here -->
      </div>

      <div class="col-md-10 p-4 content" id="content">
        <h4 class="fw-bold">User Management</h4>
        <!-- Filter Form -->
        <div class="mb-2 row">
          <label for="search" class="col-sm-2 col-form-label">Name</label>
          <div class="col-sm-2 pt-1">
            <input type="text" id="search" class="form-control form-control-sm" placeholder="slot" />
          </div>
        </div>
        <div class="mb-2 row">
          <label for="status" class="col-sm-2 col-form-label">Status</label>
          <div class="col-sm-2 pt-1">
            <select id="status" class="form-select form-select-sm">
              <option value="">All Status</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        <!-- Buttons -->
        <div class="row mb-3">
          <div class="col-md-4 d-flex gap-2">
            <button type="button" id="searchButton" class="btn btn-sm btn-primary" style="display: none;">
              <i class="fa fa-search" aria-hidden="true"></i> Search
            </button>
            <!-- tombol di toolbar -->
            <button id="openAddModal" class="btn btn-sm btn-warning">
              <i class="fa fa-user-plus"></i> Add
            </button>
          </div>
        </div>
        <!-- Alert Success -->
        <div class="alert alert-success alert-dismissible fade show" id="successAlert" style="display: none">
          <i class="fas fa-check-circle me-2"></i>
          <span id="successMessage">Add New User Success</span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Alert Error -->
        <div class="alert alert-danger alert-dismissible fade show" id="errorAlert" style="display: none">
          <i class="fas fa-times-circle me-2"></i>
          <span id="errorMessage">Failed to Add User</span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="row mb-2" style="text-align: right">
          <div class="col-sm-12">
            <button class="btn btn-light resetButton">
              <i class="fa fa-refresh" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <table class="table table-bordered table-hover text-sm">
          <thead class="table-light">
            <tr>
              <th>No</th>
              <th>Username</th>
              <th>Full Name</th>
              <th>Status</th>
              <th>Role</th>
              <th>Create By</th>
              <th>Create Date</th>
              <th>Last Update By</th>
              <th>Last Update Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Data dari JS akan di-render di sini -->
          </tbody>
        </table>
        <div class="d-flex justify-content-center align-items-center gap-3 mt-3" id="pagination">
          <button id="prev-page" class="btn btn-outline-primary btn-sm">
            <i class="fa fa-angle-left"></i>
          </button>
          <span id="pagination-info" class="mx-2">Page 1 of 1</span>
          <button id="next-page" class="btn btn-outline-primary btn-sm">
            <i class="fa fa-angle-right"></i>
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalTitle">Add User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="userId" />
          <div class="mb-3">
            <label for="userName" class="form-label">UserName</label>
            <input type="text" id="userName" class="form-control" />
          </div>
          <div class="mb-3" >
            <label for="userPassword" class="form-label">Password</label>
            <input type="text" id="userPassword" class="form-control" placeholder="bca123"/>
          </div>
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" id="fullName" class="form-control" />
          </div>
          <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select id="role" class="form-select">
              <option value="admin">admin</option>
              <option value="user">user</option>
            </select>
          </div>
          <div class="mb-0">
            <label for="userStatus" class="form-label">Status</label>
            <select id="userStatus" class="form-select">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" id="saveUserBtn" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Hapus user <strong id="deleteUserName">-</strong>?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirmDeleteUserBtn" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Bootstrap JS -->
  <!-- <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script> -->
  <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/static/bootstrap/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script> -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/user.js"></script>
</body>

</html>
