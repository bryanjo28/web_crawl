<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Keyword</title>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/styles.css" />
    <link href="/static/fontawesome/css/all.min.css" rel="stylesheet">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar loaded dynamically via JavaScript -->
            <div class="col-md-2 bg-light sidebar py-3 border-end">
                <!-- Sidebar content will be dynamically loaded here -->
            </div>

            <div class="col-md-10 p-4 content" id="content">
                <h4 class="fw-bold">Exclude Website</h4>
                <!-- Filter Form -->
                <div class="mb-2 row">
                    <label for="search" class="col-sm-2 col-form-label">Search</label>
                    <div class="col-sm-2 pt-1">
                        <input type="text" id="search" class="form-control form-control-sm" placeholder="slot">
                    </div>
                </div>
                <!-- Buttons -->
                <div class="row mb-3">
                    <div class="col-md-4 d-flex gap-2">
                        <button id="searchBtn" type="button" class="btn btn-sm btn-primary">
                            <i class="fa fa-search" aria-hidden="true"></i> Search
                        </button>
                        <!-- tombol di toolbar -->
                        <button id="openUploadBtn" class="btn btn-sm btn-success">
                            <i class="fa fa-plus"></i> Add
                        </button>

                    </div>
                </div>
                <!-- Alert Success -->
                <div class="alert alert-success alert-dismissible fade show" id="successAlert" style="display: none;">
                    <i class="fas fa-check-circle me-2"></i>
                    <span id="successMessage">Add New URL Success</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Alert Error -->
                <div class="alert alert-danger alert-dismissible fade show" id="errorAlert" style="display: none;">
                    <i class="fas fa-times-circle me-2"></i>
                    <span id="errorMessage">Failed to Add URL</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-12" style="text-align: right;">
                        <button id="resetFilter" class="btn btn-light"><i class="fa fa-refresh"
                                aria-hidden="true"></i></button>
                    </div>
                </div>
                <table class="table table-bordered table-hover text-sm">
                    <thead class="table-light">
                        <tr>
                            <th>No</th>
                            <th>URL</th> <!-- Ganti dari Keyword ke URL -->
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dari JS akan di-render di sini -->
                    </tbody>
                </table>
            </div>

            <!-- Modal Upload Keyword -->
            <div class="modal fade" id="addKeyword" tabindex="-1" aria-labelledby="addKeywordLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="addKeywordLabel">Add URL to Exclude</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <!-- Modal Add -->
                        <div class="modal-body">
                            <div class="mb-2 row">
                                <label for="excludeUrl" class="col-sm-2 col-form-label">URL</label>
                                <div class="col-sm-10 pt-1">
                                    <input type="text" id="excludeUrl" class="form-control form-control-sm"
                                        placeholder="https://example.com">
                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" id="submitKeyword" class="btn btn-primary">Submit</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Edit Keyword -->
            <div class="modal fade" id="editKeywordModal" tabindex="-1" aria-labelledby="editKeywordModalLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editKeywordModalLabel">Edit Keyword </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-2 row">
                                <label for="keywordEdit" class="col-sm-4 col-form-label">Keyword</label>
                                <div class="col-sm-6 pt-1">
                                    <input type="text" id="keywordEdit" class="form-control form-control-sm">
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" id="saveKeywordBtn" class="btn btn-primary">Save</button>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Modal Delete Keyword -->
            <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="confirmDeleteLabel">Hapus Keyword</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <p>Apakah Anda yakin ingin menghapus keyword ini?</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Hapus</button>
                        </div>
                    </div>
                </div>
            </div>



        </div>
    </div>



    <!-- Bootstrap JS -->
    <!-- <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script> -->
    <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/bootstrap/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/exclude.js"></script>
</body>

</html>
